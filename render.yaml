services:
  - type: web
    name: mmr-passport-monitor-api
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: NEON_DATABASE_URL
        sync: false
      - key: API_SECRET
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      - key: GH_DISPATCH_TOKEN
        sync: false
      - key: GH_REPO
        value: KaungOrYours/MMR_PassportRenewal_Monitoring
      - key: FRONTEND_ORIGIN
        sync: false
      - key: WEBAUTHN_RP_ID
        sync: false
      - key: WEBAUTHN_ORIGIN
        sync: false
